<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawTab</title>
  </head>
  <body>
    <main class="app">
      <header class="app__toolbar">
        <button
          id="session-toggle"
          class="toolbar__session"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="session-panel"
        >
          <span class="toolbar__session-label" id="session-label" data-i18n="app_new_session">新会话</span>
          <span class="toolbar__session-caret" aria-hidden="true">▾</span>
        </button>
        <div class="toolbar__actions">
          <button
            id="session-new"
            class="toolbar__icon-btn"
            type="button"
            data-i18n-title="session_new"
            data-i18n-aria-label="session_new"
            title="新建会话"
            aria-label="新建会话"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          </button>
          <button
            id="settings-toggle"
            class="toolbar__icon-btn"
            type="button"
            data-i18n-title="settings_title"
            data-i18n-aria-label="settings_title"
            title="设置"
            aria-label="设置"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="settings-panel"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.474l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/></svg>
          </button>
        </div>
      </header>

      <section
        id="session-panel"
        class="panel panel--session"
        role="dialog"
        data-i18n-aria-label="session_panel_label"
        aria-label="会话列表"
        hidden
      >
        <ul id="session-list" class="session-list"></ul>
        <button
          id="session-panel-new"
          class="panel__primary"
          type="button"
          data-i18n="session_new"
        >
          新建会话
        </button>
      </section>

      <section
        id="settings-panel"
        class="panel panel--settings"
        role="dialog"
        data-i18n-aria-label="settings_panel_label"
        aria-label="设置面板"
        hidden
      >
        <h2 class="panel__title" data-i18n="settings_title">设置</h2>
        <div class="settings__body">
          <aside
            id="settings-nav"
            class="settings__nav"
            role="tablist"
            aria-orientation="vertical"
          >
            <button
              type="button"
              class="settings__nav-item settings__nav-item--active"
              role="tab"
              data-section="llm"
              aria-controls="settings-section-llm"
              aria-selected="true"
              data-i18n="settings_nav_llm"
            >
              大模型
            </button>
            <button
              type="button"
              class="settings__nav-item"
              role="tab"
              data-section="display"
              aria-controls="settings-section-display"
              aria-selected="false"
              data-i18n="settings_nav_display"
            >
              显示
            </button>
            <button
              type="button"
              class="settings__nav-item"
              role="tab"
              data-section="personalization"
              aria-controls="settings-section-personalization"
              aria-selected="false"
              data-i18n="settings_nav_personalization"
            >
              个性化
            </button>
          </aside>
          <div class="settings__content">
            <section
              id="settings-section-llm"
              class="settings__section"
              role="tabpanel"
              data-section="llm"
            >
              <h3 class="settings__section-title" data-i18n="settings_llm_title">大模型</h3>
              <form id="config-form" class="settings__form">
                <label class="settings__field">
                  <span data-i18n="settings_field_base_url">Base URL</span>
                  <input id="config-base-url" type="url" placeholder="https://api.openai.com/v1" />
                </label>
                <label class="settings__field">
                  <span data-i18n="settings_field_api_key">API Key</span>
                  <input id="config-api-key" type="password" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" />
                </label>
                <label class="settings__field">
                  <span data-i18n="settings_field_model">Model</span>
                  <input id="config-model" type="text" placeholder="gpt-4o-mini" />
                </label>
                <p id="config-status" class="settings__status"></p>
                <button class="panel__primary" type="submit" data-i18n="settings_save">保存配置</button>
              </form>
            </section>
            <section
              id="settings-section-display"
              class="settings__section"
              role="tabpanel"
              data-section="display"
              hidden
            >
              <h3 class="settings__section-title" data-i18n="display_title">显示</h3>
              <label class="settings__field">
                <span data-i18n="display_language_label">界面语言</span>
                <select id="settings-language" class="settings__select">
                  <option value="auto" data-i18n="display_language_auto">跟随浏览器</option>
                  <option value="zh_CN" data-i18n="display_language_zh_cn">简体中文</option>
                  <option value="en" data-i18n="display_language_en">English</option>
                  <option value="ja" data-i18n="display_language_ja">日本語</option>
                  <option value="zh_TW" data-i18n="display_language_zh_tw">繁體中文</option>
                </select>
              </label>
            </section>
            <section
              id="settings-section-personalization"
              class="settings__section"
              role="tabpanel"
              data-section="personalization"
              hidden
            >
              <h3 class="settings__section-title" data-i18n="personalization_title">个性化</h3>
              <label class="settings__field">
                <span data-i18n="personalization_search_results_label">搜索结果列表</span>
                <select id="settings-search-results" class="settings__select">
                  <option value="all" data-i18n="personalization_search_results_all">显示所有结果</option>
                  <option value="related" data-i18n="personalization_search_results_related">只显示跟搜索相关内容</option>
                  <option value="recommended" data-i18n="personalization_search_results_recommended">只显示推荐内容</option>
                </select>
              </label>
            </section>
          </div>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chat-form" class="composer">
        <textarea
          id="chat-input"
          class="composer__input"
          rows="4"
          data-i18n-placeholder="chat_placeholder"
          placeholder="问我当前网页在讲什么，或直接问价格 / 热点 / 视频总结..."
        ></textarea>
        <div class="composer__actions">
          <p class="composer__disclaimer" data-i18n="chat_disclaimer">
            ClawTab 也可能会犯错，请核查重要信息。
          </p>
          <button id="submit-button" class="composer__submit" type="submit" data-i18n="chat_send">发送</button>
        </div>
      </form>
    </main>

    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
